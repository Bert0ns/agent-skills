name: Update skills from upstream

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync upstream skills
        run: python3 scripts/sync-upstream.py

      - name: Verify skills discovery
        run: npx skills add . --list

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/
          if git diff --staged --quiet; then
            echo "No changes found across upstream skills."
          else
            git commit -m "chore(skills): sync updates from upstream repositories"
            git push
          fi
