name: Update skills from upstream

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync upstream skills
        run: python3 scripts/sync-upstream.py

      - name: Verify skills discovery
        run: npx skills add . --list

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(skills): sync updates from upstream repositories"
          title: "chore(skills): sync updates from upstream repositories"
          body: |
            Automated weekly sync from upstream community repositories.

            - Scanned upstream repositories: `mattpocock/skills`, `cursor/plugins`, `addyosmani/agent-skills`, `vercel-labs/agent-skills`, `anthropics/skills`.
            - Verified skills discovery with `npx skills add . --list`.
          branch: "chore/sync-upstream-skills"
          base: "main"
          delete-branch: true
